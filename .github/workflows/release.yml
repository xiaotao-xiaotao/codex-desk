name: 发布桌面安装包

on:
  push:
    tags:
      - "v*"

# 使用 GitHub 自动提供的令牌创建 Release 并上传构建产物，无需额外 Token。
permissions:
  contents: write

# GitHub 托管 Runner 偶发访问 crates.io 过慢；放宽 Cargo 的低速判定并增加重试，
# 避免依赖下载的瞬时网络抖动中断整个平台构建。
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_HTTP_LOW_SPEED_LIMIT: "1"

jobs:
  build-macos:
    name: 构建 ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            # macos-13 的 Intel 共享 Runner 容易长时间排队；使用已验证可调度的
            # Apple Silicon Runner 交叉编译，仍产出可在 Intel Mac 上运行的安装包。
            runner: macos-14
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Rust 编译目标
        run: rustup target add ${{ matrix.target }}

      - name: 构建 macOS DMG
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg

      - name: 保存 macOS 安装包
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          # Release 创建完成后仅保留一天，供失败排查时下载，避免累积无意义的中转文件。
          retention-days: 1

  build-windows:
    name: 构建 Windows
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # 同时保留 MSI（企业部署友好）和 NSIS EXE（普通用户安装方便）两种格式。
      - name: 构建 Windows 安装包
        run: npm run tauri build -- --bundles msi,nsis

      - name: 保存 Windows 安装包
        uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: 构建 Linux
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Tauri 的 Linux WebView 与系统托盘依赖需要在构建机显式安装。
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Linux 安装包
        run: npm run tauri build -- --bundles deb,appimage

      - name: 保存 Linux 安装包
        uses: actions/upload-artifact@v7
        with:
          name: Linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    name: 创建 GitHub Release
    needs:
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - name: 下载所有安装包
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建 Release 并上传安装包
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.deb
            release-assets/**/*.AppImage
