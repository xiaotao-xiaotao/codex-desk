[package]
name = "codex-desk"
# Cargo 包版本仅用于内部构建；应用及安装包版本统一读取 ../version.json。
version = "0.0.0"
description = "Codex 本地桌面控制台"
authors = ["local"]
edition = "2021"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
# 账户凭据采用同目录原子替换；TOML 编辑保留用户已有配置与注释。
tempfile = "3"
toml_edit = "0.25"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
# 复用桌面依赖树已有的时间库，解析额度接口的 RFC 3339 重置时间。
time = { version = "0.3", default-features = false, features = ["std", "parsing", "formatting"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 保留桌面端默认能力，但关闭项目未使用的运行时动态 ACL。
tauri = { version = "2", default-features = false, features = [
    "common-controls-v6",
    "compression",
    "dbus",
    "tray-icon",
    "wry",
    "x11",
] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# Windows 复用系统 TLS 与证书存储；显式启用系统代理，供账户额度查询使用。
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "system-proxy"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }

[profile.release]
# 桌面安装包更重视体积；LTO 与单代码生成单元可移除跨 crate 的冗余代码。
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
