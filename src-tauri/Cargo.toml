[package]
name = "codex-desk"
# Cargo 包版本仅用于内部构建；应用及安装包版本统一读取 ../version.json。
version = "0.0.0"
description = "Codex 本地桌面控制台"
authors = ["local"]
edition = "2021"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
# 按本机自然日归档 rollout 事件，复用依赖树中已有的日期库。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# daemon 的本地 proxy 转发 WebSocket 字节；使用标准 WebSocket 库处理握手、掩码和控制帧。
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# 中文词云使用词典分词替换字符 n-gram；默认词典随二进制打包，读取时不依赖网络或本机外部文件。
jieba-rs = "0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
# 保留桌面端默认能力，但关闭项目未使用的运行时动态 ACL。
tauri = { version = "2", default-features = false, features = [
    "common-controls-v6",
    "compression",
    "dbus",
    "tray-icon",
    "wry",
    "x11",
] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "sync", "time"] }

[profile.release]
# 桌面安装包更重视体积；LTO 与单代码生成单元可移除跨 crate 的冗余代码。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
