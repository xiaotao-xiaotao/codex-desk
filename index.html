<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Codex 桌面控制台</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app" class="float-app is-expanded">
      <button id="quota-orb" class="quota-orb" type="button" aria-label="展开 Codex 额度详情" title="短按展开，按住后拖动">
        <span class="orb-ring" aria-hidden="true"></span>
        <span class="orb-value" id="orb-value">--</span>
        <span id="orb-label" class="orb-label" aria-hidden="true"></span>
      </button>

      <section class="panel" aria-live="polite">
        <header class="panel-header">
          <div>
            <div class="title-row">
              <h1 data-i18n="appTitle">Codex 桌面控制台</h1>
              <p class="eyebrow"><span class="status-dot"></span><span data-i18n="secureAccess">本机安全访问</span></p>
            </div>
          </div>
          <div id="window-drag-region" class="window-drag-region" aria-hidden="true"></div>
          <div class="header-actions">
            <button id="collapse-button" class="icon-button" type="button" title="收起为悬浮球" aria-label="收起为悬浮球">
              <span class="disclosure-chevron" aria-hidden="true"></span>
            </button>
            <button id="minimize-button" class="icon-button" type="button" title="最小化到系统托盘" aria-label="最小化到系统托盘">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
            </button>
            <button id="refresh-button" class="icon-button refresh-icon-button" type="button" title="立即刷新" aria-label="立即刷新"></button>
            <button id="always-on-top-button" class="icon-button always-on-top-button" type="button" title="置顶窗口" aria-label="置顶窗口" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l-1 6 3 3v2H6v-2l3-3-1-6Zm4 11v7" /></svg>
            </button>
            <label class="language-picker">
              <svg class="language-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h10M9 3v2M7 5c0 5-2 8-4 10M5 11c1.5 1.8 3.3 3.1 5.5 4M14 20l4-11 4 11M15.2 16h5.6" /></svg>
              <select id="language-select" title="语言：跟随系统" aria-label="语言：跟随系统">
                <option value="system">跟随系统</option>
                <option value="en">English</option>
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
              </select>
            </label>
            <button id="quit-button" class="close-icon-button" type="button" title="退出程序" aria-label="退出程序"></button>
          </div>
        </header>

        <div class="dashboard-layout is-sidebar-collapsed">
          <aside class="dashboard-sidebar">
            <div class="sidebar-brand">
              <span class="sidebar-brand-name"><svg class="sidebar-brand-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" opacity=".22" /><path d="M12 3a9 9 0 1 1-8.6 6.3M12 7.5V12l3.5 2" /></svg><span>Codex <strong>Desk</strong></span></span>
              <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-expanded="false" aria-controls="dashboard-navigation" aria-label="展开侧栏" title="展开侧栏">
                <span class="disclosure-chevron sidebar-toggle-chevron" aria-hidden="true"></span>
              </button>
            </div>
            <nav id="dashboard-navigation" class="dashboard-nav" role="tablist" aria-orientation="vertical" data-i18n-label="mainNavigation">
              <button id="nav-account" class="dashboard-nav-button is-active" type="button" role="tab" aria-selected="true" aria-controls="account-section" data-dashboard-section="account">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="2" /><path d="M7 11v2M11 11v2M15 11v2" /></svg>
                <span data-i18n="accountUsage">账户用量</span>
              </button>
              <button id="nav-accounts" class="dashboard-nav-button" type="button" role="tab" aria-selected="false" aria-controls="accounts-section" tabindex="-1" data-dashboard-section="accounts">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3" /><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M21 20v-2a6 6 0 0 0-4-5.65" /></svg>
                <span data-i18n="accountsTitle">账户管理</span>
                <small class="accounts-new-badge" hidden>+1</small>
              </button>
            </nav>
            <div class="sidebar-bottom">
              <div class="sidebar-utilities">
            <button id="theme-button" class="dashboard-nav-button sidebar-utility-button" type="button" title="主题：白天" aria-label="主题：白天">
              <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
              <span id="theme-label"></span>
            </button>
            <button id="settings-button" class="dashboard-nav-button sidebar-utility-button" type="button" title="设置" aria-label="打开设置">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.3-2 .9-2.2-.7-2.5 4.3 1.7 1.6v2.3l-1.7 1.6 2.5 4.3 2.2-.7 2 .9.6 2.2h5l.6-2.2 2-.9 2.2.7 2.5-4.3-1.7-1.6v-2.3l1.7-1.6-2.5-4.3-2.2.7-2-.9L14.5 3Z"/><circle cx="12" cy="12" r="3"/></svg>
              <span data-i18n="settingsTitle">设置</span>
            </button>
              </div>
            </div>
          </aside>
          <div class="dashboard-workspace">
            <section id="dashboard-error" class="dashboard-error" aria-live="assertive" hidden>
              <svg class="dashboard-error-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4.9 8.5a10.4 10.4 0 0 1 14.2 0M7.8 11.4a6.3 6.3 0 0 1 8.4 0M10.7 14.4a2.2 2.2 0 0 1 2.6 0" />
                <path d="M12 18.2h.01" />
              </svg>
              <h2 id="dashboard-error-title"></h2>
              <p id="dashboard-error-description"></p>
              <div class="dashboard-error-actions">
                <button id="dashboard-retry" class="dashboard-retry-button" type="button"></button>
                <button id="account-switch-recovery" class="account-switch-trigger" data-open-account-switch type="button"><span data-i18n="accountsManage">切换账户</span></button>
              </div>
            </section>

            <section id="accounts-section" class="dashboard-section dashboard-page accounts-page app-scrollable" role="tabpanel" aria-labelledby="nav-accounts" tabindex="0" hidden></section>
            <section id="account-section" class="dashboard-section dashboard-page quota-section" role="tabpanel" aria-labelledby="nav-account" tabindex="0"></section>

            <div class="dashboard-status">
              <div id="status" class="status"></div>
              <span class="account-sync-time" hidden><span data-i18n="accountLastSynced">最近同步</span><time id="account-last-synced"></time></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form" class="settings-content" novalidate>
        <header class="settings-header">
          <div>
            <h2 id="settings-title" class="visually-hidden">设置</h2>
            <p id="settings-intro" class="settings-intro">配置网络连接和数据刷新方式，所有设置仅保存在本机。</p>
          </div>
          <button id="settings-close" class="close-icon-button" type="button" aria-label="关闭设置"></button>
        </header>
        <div class="settings-tabs" role="tablist" aria-label="设置分类"></div>
        <div class="settings-body app-scrollable">
          <!-- 新分类在面板声明唯一标识和翻译键，导航及键盘交互由视图自动接入。 -->
          <section id="settings-panel-connection" class="settings-panel" data-settings-category="connection" data-settings-label="settingsConnectionTab" role="tabpanel">
            <section class="settings-group settings-refresh-group">
              <label id="settings-refresh-label" for="settings-refresh-interval">自动刷新间隔</label>
              <p id="settings-refresh-hint" class="settings-hint">控制账户用量和账户状态的自动刷新间隔。</p>
              <select id="settings-refresh-interval" class="settings-refresh-select" aria-describedby="settings-refresh-hint">
                <option value="180">3 分钟</option>
                <option value="300">5 分钟</option>
                <option value="600">10 分钟</option>
                <option value="1200">20 分钟</option>
              </select>
            </section>
          </section>
          <section id="settings-panel-proxy" class="settings-panel" data-settings-category="proxy" data-settings-label="settingsProxyTitle" role="tabpanel" hidden>
            <section class="settings-group settings-proxy-group" aria-labelledby="settings-proxy-title">
              <span id="settings-proxy-title" class="settings-group-label" data-settings-layout-i18n="settingsProxyTitle">网络代理</span>
              <div class="settings-proxy-modes" role="radiogroup" aria-labelledby="settings-proxy-title">
                <label><input type="radio" name="proxyMode" value="off" /><span data-settings-layout-i18n="settingsProxyOff">关闭</span></label>
                <label><input type="radio" name="proxyMode" value="system" checked /><span data-settings-layout-i18n="settingsProxyToggle">系统代理</span></label>
                <label><input type="radio" name="proxyMode" value="custom" /><span data-settings-layout-i18n="settingsProxyCustom">自定义代理</span></label>
              </div>
              <div id="settings-proxy-address" class="settings-proxy-address" hidden>
                <label for="settings-proxy-url" data-settings-layout-i18n="settingsProxyAddress">代理地址</label>
                <input id="settings-proxy-url" type="url" autocomplete="off" spellcheck="false" placeholder="http://host:port" aria-describedby="settings-proxy-address-hint settings-proxy-error" />
                <p id="settings-proxy-address-hint" class="settings-hint" data-settings-layout-i18n="settingsProxyAddressHint">支持 HTTP / HTTPS，填写主机与端口即可。</p>
                <p id="settings-proxy-error" class="settings-proxy-error" role="status" hidden></p>
              </div>
            </section>
          </section>
          <section id="settings-panel-alerts" class="settings-panel" data-settings-category="alerts" data-settings-label="settingsAlertsTab" role="tabpanel" hidden>
            <section class="settings-group">
              <span id="settings-quota-thresholds-label" class="settings-group-label">额度提醒阈值</span>
              <p id="settings-quota-thresholds-hint" class="settings-hint">固定三个提醒档次，数值需依次递增。</p>
              <div class="settings-threshold-grid" role="group" aria-labelledby="settings-quota-thresholds-label" aria-describedby="settings-quota-thresholds-hint settings-status">
                <label class="settings-threshold-item" for="settings-quota-threshold-1">
                  <span id="settings-quota-threshold-low">第一档</span>
                  <span class="settings-threshold-input">
                    <input id="settings-quota-threshold-1" type="number" min="1" max="100" step="1" value="80" required />
                    <span aria-hidden="true">%</span>
                  </span>
                </label>
                <label class="settings-threshold-item" for="settings-quota-threshold-2">
                  <span id="settings-quota-threshold-medium">第二档</span>
                  <span class="settings-threshold-input">
                    <input id="settings-quota-threshold-2" type="number" min="1" max="100" step="1" value="90" required />
                    <span aria-hidden="true">%</span>
                  </span>
                </label>
                <label class="settings-threshold-item" for="settings-quota-threshold-3">
                  <span id="settings-quota-threshold-high">第三档</span>
                  <span class="settings-threshold-input">
                    <input id="settings-quota-threshold-3" type="number" min="1" max="100" step="1" value="100" required />
                    <span aria-hidden="true">%</span>
                  </span>
                </label>
              </div>
            </section>
            <section class="settings-group">
              <span id="settings-email-label" class="settings-group-label">邮箱显示</span>
              <p id="settings-email-hint" class="settings-hint">统一控制账户用量和账户管理中的邮箱显示。</p>
              <div class="settings-email-options" role="radiogroup" aria-labelledby="settings-email-label" aria-describedby="settings-email-hint">
                <label><input type="radio" name="emailVisibility" value="show" checked /><span id="settings-email-show">显示完整邮箱</span></label>
                <label><input type="radio" name="emailVisibility" value="hide" /><span id="settings-email-hide">隐藏邮箱（脱敏显示）</span></label>
              </div>
            </section>
          </section>
        </div>
        <footer class="settings-actions">
          <div class="settings-footer-info">
            <p id="settings-storage-hint" class="settings-storage-hint">正在读取设置保存目录…</p>
            <p id="settings-status" class="settings-status" aria-live="polite" hidden></p>
          </div>
          <div class="settings-action-buttons">
            <button id="settings-cancel" class="cancel-button" type="button">取消</button>
            <button id="settings-save" class="primary-action-button" type="submit">保存并验证</button>
          </div>
        </footer>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
