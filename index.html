<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Codex 桌面控制台</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app" class="float-app is-expanded">
      <button id="quota-orb" class="quota-orb" type="button" aria-label="展开 Codex 额度详情" title="短按展开，按住后拖动">
        <span class="orb-ring" aria-hidden="true"></span>
        <span class="orb-value" id="orb-value">--</span>
        <span id="orb-label" class="orb-label" aria-hidden="true"></span>
      </button>

      <section class="panel" aria-live="polite">
        <header class="panel-header">
          <div>
            <div class="title-row">
              <h1 data-i18n="appTitle">Codex 桌面控制台</h1>
              <p class="eyebrow"><span class="status-dot"></span><span data-i18n="secureAccess">本机安全访问</span></p>
            </div>
          </div>
          <div id="window-drag-region" class="window-drag-region" aria-hidden="true"></div>
          <div class="header-actions">
            <button id="collapse-button" class="icon-button" type="button" title="收起为悬浮球" aria-label="收起为悬浮球">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
            </button>
            <button id="diagnostics-button" class="icon-button" type="button" title="诊断 Codex CLI" aria-label="诊断 Codex CLI">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 10v5M12 7.5h.01" /></svg>
            </button>
            <div class="language-picker">
              <button id="language-button" class="icon-button" type="button" title="语言：跟随系统" aria-label="语言：跟随系统" aria-expanded="false" aria-controls="language-menu">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h10M9 3v2M7 5c0 5-2 8-4 10M5 11c1.5 1.8 3.3 3.1 5.5 4M14 20l4-11 4 11M15.2 16h5.6" /></svg>
              </button>
              <div id="language-menu" class="language-menu" role="menu" hidden>
                <button type="button" role="menuitem" data-language="system">跟随系统</button>
                <button type="button" role="menuitem" data-language="zh-CN">简体中文</button>
                <button type="button" role="menuitem" data-language="zh-TW">繁體中文</button>
                <button type="button" role="menuitem" data-language="en">English</button>
                <button type="button" role="menuitem" data-language="ja">日本語</button>
                <button type="button" role="menuitem" data-language="ko">한국어</button>
              </div>
            </div>
            <button id="theme-button" class="icon-button" type="button" title="主题：跟随系统" aria-label="主题：跟随系统">
              <svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
            </button>
            <button id="minimize-button" class="icon-button" type="button" title="最小化到系统托盘" aria-label="最小化到系统托盘">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" /></svg>
            </button>
            <button id="refresh-button" class="icon-button" type="button" title="立即刷新" aria-label="立即刷新">
              <svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 16.24 7.76L13 11h7V4z" /></svg>
            </button>
            <button id="quit-button" class="close-icon-button" type="button" title="退出程序" aria-label="退出程序"></button>
          </div>
        </header>

        <section class="dashboard-section quota-section" aria-labelledby="quota-heading">
          <div class="section-heading">
            <div class="quota-title-row">
              <h2 id="quota-heading" class="quota-heading-title" data-i18n="accountUsage">账户用量</h2>
              <span class="quota-heading-subtitle" data-i18n="quotaOverview">额度概览</span>
            </div>
            <div class="quota-alert-control">
              <span id="quota-alert-status" class="quota-alert-status"></span>
              <button id="quota-alert-toggle" class="quota-alert-toggle" type="button"></button>
            </div>
          </div>
          <div class="account-details">
            <div class="account-detail-item account-email-item">
              <span class="account-detail-label" data-i18n="accountEmail">登录邮箱</span>
              <strong id="account-email">正在读取账号信息…</strong>
            </div>
            <div class="account-detail-item">
              <span class="account-detail-label" data-i18n="accountPlan">订阅方案</span>
              <strong id="account-plan">正在读取账号信息…</strong>
            </div>
            <div id="reset-credits-row" class="account-reset-credits" hidden>
              <span class="account-detail-label" data-i18n="resetCreditsTitle">使用限额重置</span>
              <strong id="reset-credits-summary"></strong>
              <span id="reset-credits-tooltip" class="reset-credits-tooltip" role="tooltip"></span>
            </div>
            <div class="account-billing-actions">
              <button id="account-billing" class="account-billing-button" type="button" data-i18n="openBilling">查看订阅到期时间</button>
            </div>
          </div>
          <p id="account-message" class="account-message" hidden></p>
          <div class="account-quota-divider" aria-hidden="true"></div>
          <div id="quota-list" class="quota-list" aria-live="polite"></div>
        </section>

        <section class="dashboard-section trend-section" aria-labelledby="trend-heading">
          <div class="section-heading trend-heading">
            <div class="section-title-row">
              <p id="trend-heading" class="section-kicker" data-i18n="trendKicker">活动洞察</p>
              <div class="trend-range-summary">
                <div class="trend-range-picker">
                  <select id="trend-range" class="trend-range" aria-label="趋势范围"></select>
                  <svg class="disclosure-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
                </div>
                <span id="trend-total" class="trend-total"></span>
              </div>
            </div>
            <div class="trend-heading-actions">
              <div id="trend-controls" class="trend-controls" aria-label="趋势指标"></div>
            </div>
          </div>
          <div id="thread-trend-chart" class="thread-trend-chart" aria-live="polite"></div>
        </section>

        <section class="dashboard-section trend-section token-usage-section" aria-labelledby="token-usage-heading">
          <div class="section-heading trend-heading">
            <div class="section-title-row">
              <p id="token-usage-heading" class="section-kicker" data-i18n="tokenUsageKicker">Token 洞察</p>
              <div class="trend-range-summary">
                <div class="trend-range-picker">
                  <select id="token-usage-range" class="trend-range" aria-label="Token 趋势范围"></select>
                  <svg class="disclosure-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
                </div>
                <span id="token-usage-total" class="trend-total"></span>
              </div>
            </div>
          </div>
          <div id="token-usage-chart" class="thread-trend-chart token-usage-chart" aria-live="polite"></div>
        </section>

        <section class="dashboard-section sessions-section" aria-labelledby="threads-heading">
          <div class="section-heading sessions-heading">
            <div class="section-title-row">
              <p class="section-kicker" data-i18n="localHistory">本地历史</p>
              <h2 id="threads-heading" data-i18n="recentThreads">最近会话</h2>
            </div>
            <div class="sessions-heading-actions">
              <div class="thread-tools">
                <span id="search-result" class="search-result" data-i18n="localOnly">仅从本机读取</span>
                <label class="thread-search">
                  <span class="visually-hidden" data-i18n="searchThreads">搜索最近会话</span>
                  <input id="thread-search" type="search" placeholder="搜索标题或会话 ID" data-i18n-placeholder="searchPlaceholder" autocomplete="off" />
                </label>
                <div class="thread-transfer-actions">
                  <button id="import-threads" class="thread-action-button" type="button" data-i18n="importThreads">导入</button>
                  <button id="export-threads" class="thread-action-button thread-action-button-primary" type="button" data-i18n="exportThreads" disabled>导出</button>
                </div>
              </div>
              <button id="sessions-toggle" class="section-collapse-button" type="button" aria-expanded="false" aria-controls="sessions-content">
                <span id="sessions-toggle-label" class="visually-hidden">展开本地历史</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
              </button>
            </div>
          </div>
          <div id="sessions-content" class="sessions-content" hidden>
            <div id="thread-selection-bar" class="thread-selection-bar" hidden>
              <button id="select-page-threads" class="selection-button" type="button" data-i18n="selectPage">全选本页</button>
              <button id="select-all-threads" class="selection-button" type="button" data-i18n="selectAllResults">全选筛选结果</button>
              <button id="clear-thread-selection" class="selection-button selection-button-muted" type="button" data-i18n="clearSelection">清除</button>
              <span id="selected-thread-count" class="selected-thread-count" aria-live="polite"></span>
            </div>
            <div id="thread-list" class="thread-list app-scrollable" aria-live="polite"></div>
            <nav id="thread-pagination" class="thread-pagination" aria-label="会话分页" hidden>
              <button id="previous-page" class="pagination-button" type="button" data-i18n="previousPage">上一页</button>
              <span id="page-indicator" class="page-indicator"></span>
              <button id="next-page" class="pagination-button" type="button" data-i18n="nextPage">下一页</button>
            </nav>
          </div>
        </section>

        <div id="status" class="status" data-i18n="readingLocalData">正在读取本地 Codex 数据…</div>
      </section>
    </main>
    <input id="import-file-input" type="file" accept="application/json,.codex-desk.json" hidden />
    <dialog id="thread-dialog" class="thread-dialog" aria-labelledby="thread-dialog-heading">
      <header class="thread-dialog-toolbar">
        <h2 id="thread-dialog-heading" data-i18n="threadDetail">会话详情</h2>
        <button id="dialog-close" class="close-icon-button" type="button" aria-label="关闭会话详情"></button>
      </header>
      <section class="dialog-content">
        <aside class="dialog-sidebar">
          <header class="dialog-header">
            <div>
              <h3 id="dialog-title">会话详情</h3>
              <p id="dialog-meta" class="dialog-meta"></p>
            </div>
          </header>
          <section class="dialog-insights" aria-label="会话洞察">
            <div id="thread-insights" class="insight-list"></div>
          </section>
          <div class="dialog-search" role="search">
            <label class="visually-hidden" for="dialog-search-input" data-i18n="searchThreadMessages">搜索当前会话</label>
            <input id="dialog-search-input" type="search" autocomplete="off" placeholder="搜索当前会话内容" data-i18n-placeholder="searchThreadMessagesPlaceholder" />
            <span id="dialog-search-result" class="dialog-search-result" aria-live="polite"></span>
          </div>
          <div id="dialog-status" class="dialog-status" data-i18n="readingThread">正在读取会话…</div>
          <section class="dialog-activity-panel" aria-label="近期操作">
            <details class="activity-disclosure" open>
              <summary><span data-i18n="recentActivity">近期操作</span><span class="activity-summary-hint" data-i18n="activitySummaryHint">可收起</span></summary>
              <div id="thread-activity" class="activity-list app-scrollable"></div>
            </details>
          </section>
        </aside>
        <section class="dialog-messages-pane" aria-label="聊天消息">
          <div id="message-list" class="message-list app-scrollable" aria-live="polite"></div>
        </section>
      </section>
      <section id="file-diff-panel" class="file-diff-panel" role="dialog" aria-modal="true" aria-labelledby="file-diff-title" hidden>
        <header class="file-diff-toolbar">
          <div>
            <h3 id="file-diff-title"></h3>
            <p id="file-diff-summary" class="file-diff-summary"></p>
          </div>
          <div class="file-diff-actions">
            <div class="file-diff-layout-switch" role="group">
              <button id="file-diff-side-by-side" class="file-diff-layout-button" type="button" aria-pressed="true"></button>
              <button id="file-diff-unified" class="file-diff-layout-button" type="button" aria-pressed="false"></button>
            </div>
            <button id="file-diff-close" class="close-icon-button" type="button"></button>
          </div>
        </header>
        <div id="file-diff-list" class="file-diff-list app-scrollable"></div>
      </section>
      <section id="thread-image-preview" class="thread-image-preview" role="dialog" aria-modal="true" aria-labelledby="thread-image-preview-title" hidden>
        <h3 id="thread-image-preview-title" class="visually-hidden"></h3>
        <button id="thread-image-preview-close" class="close-icon-button" type="button"></button>
        <img id="thread-image-preview-image" alt="" />
      </section>
    </dialog>
    <dialog id="diagnostics-dialog" class="diagnostics-dialog" aria-labelledby="diagnostics-title">
      <section class="diagnostics-content">
        <header class="diagnostics-header">
          <div>
            <p class="section-kicker" data-i18n="diagnosticsKicker">本机连接</p>
            <h2 id="diagnostics-title" data-i18n="diagnostics">Codex 环境诊断</h2>
          </div>
          <button id="diagnostics-close" class="close-icon-button" type="button" aria-label="关闭诊断"></button>
        </header>
        <p id="diagnostics-intro" class="diagnostics-intro" data-i18n="diagnosticsIntro">仅检查本机 Codex CLI、app-server 和当前登录态，不会读取认证文件或上传数据。</p>
        <div id="diagnostics-results" class="diagnostics-results" aria-live="polite"></div>
        <p id="diagnostics-error" class="diagnostics-error" hidden></p>
        <footer class="diagnostics-actions">
          <button id="diagnostics-copy" type="button" disabled></button>
          <button id="diagnostics-run" class="thread-action-button thread-action-button-primary" type="button"></button>
        </footer>
      </section>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
